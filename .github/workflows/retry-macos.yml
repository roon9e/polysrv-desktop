name: Retry macOS.

on:
  workflow_run:
    workflows: ["MacOS.", "MacOS Packaged.", "Release."]
    types: [completed]

permissions:
  actions: write

concurrency:
  group: retry-macos
  cancel-in-progress: false

jobs:

  retry:
    name: Retry
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    steps:
      # A macOS job that never reached a runner leaves the run failed; the
      # jobs that did not run are then retried. Anything that ran and still
      # failed is a real result and is left alone.
      - name: Re-run a macOS build that never reached a step.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "attempt $ATTEMPT reached, giving up"
            exit 0
          fi
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs?per_page=100")
          total=$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name | startswith("MacOS"))] | length')
          empty=$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name | startswith("MacOS")) | select((.steps | length) == 0)] | length')
          ran=$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name | startswith("MacOS")) | select((.steps | length) > 0) | select(.conclusion != "success")] | length')
          echo "macOS jobs: $total, without a step: $empty, ran and failed: $ran"
          if [ "$total" -gt 0 ] && [ "$empty" -gt 0 ] && [ "$ran" -eq 0 ]; then
            echo "a macOS job never reached a runner, retrying the jobs that did not run"
            gh run rerun "$RUN" --failed
          else
            echo "the run is a real result, leaving it alone"
          fi
