name: MacOS Packaged.

on:
  workflow_call:
  workflow_dispatch:
  push:
    # Pushes to the canary branches run only canary.yml, see there.
    branches-ignore:
      - public-canary
      - private-canary
  pull_request:

concurrency:
  group: MacOS Packaged.-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:

  macos:
    name: MacOS ${{ matrix.arch }}
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        defines:
          - ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      MACOSX_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew install automake libtool meson nasm ninja pkg-config

          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          GNU_CMAKE=$(python3 -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$(brew --prefix)/share/cmake/Modules/Compiler/GNU.cmake")
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' "$GNU_CMAKE"

      - name: Restore the Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-v2-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: |
            ${{ runner.OS }}-libs-v2-
            ${{ runner.OS }}-libs-

      - name: Libraries.
        id: libraries
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Hash the prepared cache keys.
        if: steps.libraries.outcome == 'success'
        run: |
          KEYS_HASH=$(find Libraries/cache_keys ThirdParty/cache_keys -type f \
            -exec shasum -a 256 {} + 2>/dev/null | sort | shasum -a 256 | cut -d' ' -f1)
          echo "LIBS_KEYS_HASH=$KEYS_HASH" >> $GITHUB_ENV

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -name 'macos_toolchain.json' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/src/wallet_engine/*' -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' ! -path '*/target/*' ')' -o -perm +111 ')' -type f ')' -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' ')' -delete

      - name: Save the Libraries cache.
        if: steps.libraries.outcome == 'success' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-v2-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-${{ env.LIBS_KEYS_HASH }}

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME/Telegram

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=PolySRV macos ${{ matrix.arch }} ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=PolySRV macos ${{ matrix.arch }}" >> $GITHUB_ENV
          fi

          ./configure.sh \
          -G Ninja \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_OSX_ARCHITECTURES=$MACOSX_ARCH \
          -D DESKTOP_APP_MAC_ARCH=$MACOSX_ARCH \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

          cmake --build ../out --parallel

          codesign --force --deep --sign - ../out/PolySRV.app
          codesign --force --sign - ../out/Updater
          codesign --verify --deep --strict --verbose=2 ../out/PolySRV.app

      - name: Create disk image.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME/out
          rm -rf dmg
          mkdir dmg
          ditto PolySRV.app dmg/PolySRV.app
          for attempt in 1 2 3; do
            if hdiutil create -volname "PolySRV" -srcfolder dmg -ov -format UDZO PolySRV-macos-${{ matrix.arch }}.dmg; then
              break
            fi
            sleep 20
          done
          test -f PolySRV-macos-${{ matrix.arch }}.dmg

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/out
          mkdir artifact
          ditto -c -k --sequesterRsrc --keepParent PolySRV.app artifact/PolySRV-macos-${{ matrix.arch }}.zip
          mv PolySRV-macos-${{ matrix.arch }}.dmg artifact/
          cp Updater artifact/
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/out/artifact/
          retention-days: 1

  prune:
    needs: [macos]
    if: always() && github.ref == 'refs/heads/dev'
    permissions:
      actions: write
    uses: ./.github/workflows/prune-caches.yml
    with:
      prefixes: |
        macOS-libs-
