name: Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:

  linux:
    uses: ./.github/workflows/linux.yml

  windows:
    uses: ./.github/workflows/win.yml

  macos:
    uses: ./.github/workflows/mac_packaged.yml

  publish:
    name: Publish
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download the Linux build.
        uses: actions/download-artifact@v8
        with:
          name: PolySRV linux
          path: artifacts/linux

      - name: Download the Windows build.
        uses: actions/download-artifact@v8
        with:
          name: PolySRV windows x64
          path: artifacts/windows

      - name: Download the Windows build for ARM64.
        uses: actions/download-artifact@v8
        with:
          name: PolySRV windows arm64
          path: artifacts/windows-arm64

      - name: Download the macOS build for Apple Silicon.
        uses: actions/download-artifact@v8
        with:
          name: PolySRV macos arm64
          path: artifacts/macos-arm64

      - name: List the artifacts.
        run: find artifacts -type f

      - name: Name the published files.
        run: |
          mkdir release
          cp artifacts/linux/PolySRV release/PolySRV-linux-x64
          cp artifacts/linux/Updater release/Updater-linux-x64
          cp artifacts/macos-arm64/PolySRV-macos-arm64.dmg release/
          cp artifacts/windows/Updater.exe release/Updater-windows-x64.exe
          cp artifacts/windows-arm64/Updater.exe release/Updater-windows-arm64.exe
          zip -j release/PolySRV-windows-x64.zip artifacts/windows/PolySRV.exe
          zip -j release/PolySRV-windows-arm64.zip artifacts/windows-arm64/PolySRV.exe
          ls -l release

      - name: Create the checksums.
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Publish the release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --verify-tag \
            --title "PolySRV $GITHUB_REF_NAME" \
            --generate-notes
