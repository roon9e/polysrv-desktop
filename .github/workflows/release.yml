name: Release.

on:
  push:
    tags: ['v*']

permissions:
  actions: write
  contents: write

jobs:

  linux:
    uses: ./.github/workflows/linux.yml

  windows:
    uses: ./.github/workflows/win.yml

  macos:
    uses: ./.github/workflows/mac_packaged.yml

  publish:
    name: Publish
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A failed build leaves its artifact missing; the release then carries
      # only what was built instead of failing as a whole.
      - name: Download the Linux build.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: PolySRV linux
          path: artifacts/linux

      - name: Download the Windows build.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: PolySRV windows x64
          path: artifacts/windows

      - name: Download the Windows build for ARM64.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: PolySRV windows arm64
          path: artifacts/windows-arm64

      - name: Download the macOS build for Apple Silicon.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: PolySRV macos arm64
          path: artifacts/macos-arm64

      - name: Download the macOS build for Intel.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: PolySRV macos x64
          path: artifacts/macos-x64

      - name: Name the published files.
        run: |
          mkdir -p release
          if [ -f artifacts/linux/PolySRV ]; then cp artifacts/linux/PolySRV release/PolySRV-linux-x64; fi
          if [ -f artifacts/macos-arm64/PolySRV-macos-arm64.dmg ]; then cp artifacts/macos-arm64/PolySRV-macos-arm64.dmg release/; fi
          if [ -f artifacts/macos-x64/PolySRV-macos-x64.dmg ]; then cp artifacts/macos-x64/PolySRV-macos-x64.dmg release/; fi
          if [ -f artifacts/windows/PolySRV.exe ]; then cp artifacts/windows/PolySRV.exe release/PolySRV-windows-x64.exe; fi
          if [ -f artifacts/windows-arm64/PolySRV.exe ]; then cp artifacts/windows-arm64/PolySRV.exe release/PolySRV-windows-arm64.exe; fi
          ls -l release

      - name: Create the checksums.
        working-directory: release
        run: |
          shopt -s nullglob
          files=(*)
          shopt -u nullglob
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS
          fi

      - name: Publish the release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          shopt -s nullglob
          assets=(release/*)
          shopt -u nullglob
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No build succeeded; publishing the release without artifacts."
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --title "PolySRV $GITHUB_REF_NAME" \
            --notes "PolySRV Desktop for Windows (x64, arm64), Linux (x64) and macOS (x64, Apple Silicon)."
