name: Publish the no-CI branch.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-no-ci
  cancel-in-progress: true

jobs:

  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone.
        uses: actions/checkout@v7

      - name: Publish the branch.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Telegram/build/publish_no_ci_branch.py
