name: Windows.

on:
  workflow_call:
  push:
    # Pushes to the canary branches run only canary.yml, see there.
    branches-ignore:
      - public-canary
      - private-canary
  pull_request:

concurrency:
  group: Windows.-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:

  windows:
    name: Windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        qt: [""]
        generator: ["Ninja"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          set "ROOT=D:"
          if not exist D:\ set "ROOT=C:"
          mkdir "%ROOT%\TBuild\Libraries"
          if not exist "%GITHUB_WORKSPACE%\TBuild" mklink /d "%GITHUB_WORKSPACE%\TBuild" "%ROOT%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo REALTBUILD=%ROOT%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Report disk space.
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $null -ne $_.Used } |
            Select-Object Name,
              @{n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 2) } },
              @{n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 2) } }

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore the ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Restore the Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v3-
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Restore the Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-qt-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-qt-v3-
            ${{ runner.OS }}-${{ matrix.arch }}-qt-v2-
            ${{ runner.OS }}-${{ matrix.arch }}-qt-

      - name: Free up the runner.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-MpPreference -DisableRealtimeMonitoring $true
          $patterns = @(
            'C:\ProgramData\Package Cache',
            'C:\Program Files\dotnet',
            'C:\Program Files\nodejs',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files (x86)\Microsoft\Edge',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files\Android',
            'C:\Program Files\MongoDB',
            'C:\Program Files\Microsoft\jdk*',
            'C:\hostedtoolcache\windows\Java',
            'C:\hostedtoolcache\windows\Go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\Rust',
            'C:\hostedtoolcache\windows\Bazel',
            'C:\hostedtoolcache\windows\Kotlin',
            'C:\hostedtoolcache\windows\Sbt',
            'C:\hostedtoolcache\windows\Stack',
            'C:\vcpkg',
            'C:\ProgramData\chocolatey\logs',
            'C:\Windows\SoftwareDistribution\Download',
            'C:\Windows\Temp'
          )
          foreach ($pattern in $patterns) {
            Get-Item -Path $pattern | ForEach-Object {
              "Removing $($_.FullName)"
              Remove-Item -Recurse -Force $_.FullName
            }
          }
          Get-PSDrive C | Select-Object Name,
            @{n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 2) } }

      - name: Libraries.
        id: libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent skip-symbols ${{ matrix.qt }}

      - name: Hash the prepared cache keys.
        if: steps.libraries.outcome == 'success'
        shell: bash
        run: |
          keys_hash() {
            find "$LibrariesPath/cache_keys" -type f "$@" -print0 \
              | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
          }
          echo "LIBS_KEYS_HASH=$(keys_hash ! -iname 'qt_*')" >> "$GITHUB_ENV"
          echo "QT_KEYS_HASH=$(keys_hash -iname 'qt_*')" >> "$GITHUB_ENV"

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="PolySRV windows"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: |
          df -h
          # Qt's package files reference the object dirs of its build.
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' ! -path '*/target/*' ')' ')' -type f ')' -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' ')' -delete
          df -h

      - name: Report memory.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os) {
            "RAM total MB: {0}  free MB: {1}" -f [int]($os.TotalVisibleMemorySize / 1KB), [int]($os.FreePhysicalMemory / 1KB)
          }
          Get-CimInstance Win32_PageFileUsage | ForEach-Object {
            "PageFile {0}  allocated MB: {1}  peak MB: {2}" -f $_.Name, $_.AllocatedBaseSize, $_.PeakUsage
          }
          try {
            $c = Get-Counter '\Memory\Commit Limit'
            "Commit limit MB: {0}" -f [int]($c.CounterSamples[0].CookedValue / 1MB)
          } catch {}

      - name: Save the Libraries cache.
        if: steps.libraries.outcome == 'success' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-${{ env.CACHE_KEY }}-${{ env.LIBS_KEYS_HASH }}

      - name: Save the Qt cache.
        if: steps.libraries.outcome == 'success' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-qt-v3-${{ env.CACHE_KEY }}-${{ env.QT_KEYS_HASH }}

      - name: Compute build parallelism.
        shell: pwsh
        run: |
          $ram = [double](Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          $cpu = [Environment]::ProcessorCount
          $byRam = [int][Math]::Floor($ram / 2.5GB)
          $parallel = [Math]::Min($cpu, $byRam)
          if ($parallel -lt 1) { $parallel = 1 }
          "RAM=$ram CPU=$cpu PARALLEL=$parallel"
          "TDESKTOP_BUILD_PARALLEL=$parallel" >> $env:GITHUB_ENV

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd /d %REALTBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D CMAKE_CXX_FLAGS_RELEASE="/O1 /Ob1 /DNDEBUG /Zm2000" ^
          -D CMAKE_C_FLAGS_RELEASE="/O1 /Ob1 /DNDEBUG" ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Release --parallel %TDESKTOP_BUILD_PARALLEL%

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          if not exist %OUT%\PolySRV.exe set OUT=%TBUILD%\%REPO_NAME%\out
          mkdir artifact
          move %OUT%\PolySRV.exe artifact/
          move %OUT%\Updater.exe artifact/
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 1

      - name: Save the ThirdParty cache.
        if: >
          always()
            && steps.cache-third-party.outputs.cache-hit != 'true'
            && steps.libraries.outcome == 'success'
            && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

  prune:
    needs: [windows]
    if: always() && github.ref == 'refs/heads/dev'
    permissions:
      actions: write
    uses: ./.github/workflows/prune-caches.yml
    with:
      prefixes: |
        Windows-X64-third-party-
        Windows-ARM64-third-party-
        Windows-x64-libs-
        Windows-arm64-libs-
        Windows-x64-qt-
        Windows-arm64-qt-
